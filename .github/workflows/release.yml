name: release

# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in the
# repository or in Actions secrets.
#
# One-time setup on PyPI:
#   https://pypi.org/manage/project/som-window-mcp/settings/publishing/
#   owner: Nikita-Pugach, repository: som-window-mcp,
#   workflow: release.yml, environment: pypi
#
# Then: bump the version in pyproject.toml and __init__.py, tag, push the tag.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
