name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The package imports Win32 through ctypes, so the unit tests need Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
